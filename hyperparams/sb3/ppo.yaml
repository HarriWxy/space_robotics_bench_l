n_timesteps: 100000000
policy: "MultiInputPolicy"
# Policy input for the locomotion comparison. Other tasks can override this
# with an explicit `agent.observation_keys` value.
observation_keys: [proprio,proprio_dyn,command]
batch_size: 1024
clip_range: 0.2
ent_coef: 0.01
gae_lambda: 0.95
gamma: 0.997
learning_rate: lin_0.0001
max_grad_norm: 1 # 0.5
n_epochs: 16
n_steps: 24
normalize: false # true
sde_sample_freq: 4
vf_coef: 1  #0.5
policy_kwargs: "dict(
  log_std_init=0,
  net_arch=[512, 256, 128],
  )"
