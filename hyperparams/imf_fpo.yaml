# Experimental Improved MeanFlow FPO configuration for the native Isaac Lab H1 task.
# The iMF actor predicts an interval-average velocity plus an auxiliary
# instantaneous velocity.  Its matching algorithm is IMFFPO.

num_steps_per_env: 32
max_iterations: 12104
empirical_normalization: false
randomize_reset_episode_progress: 0.0
clip_actions: null
save_interval: 2500
experiment_name: h1_imf_fpo
run_name: ""
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
eval_episodes: 10
flow_eval_modes: [zero, fixed_seed, random]
flow_eval_fixed_seed: 12345
enable_post_training_eval: false
post_eval_checkpoint_interval: 1
resume: false
load_run: ".*"
load_checkpoint: "model_.*.pt"

policy:
  class_name: IMFActorCritic
  init_noise_std: 1.0
  actor_hidden_dims: [512, 256, 128]
  critic_hidden_dims: [512, 256, 128]
  activation: elu
  actor_scale: 1.0
  actor_mlp_output_scale: 1.0
  actor_final_layer_weight_scale: null
  timestep_embed_dim: 8
  training_sampling_steps: null
  # iMF is designed to make one full noise-to-action mean-flow jump.
  sampling_steps: 1
  cfm_loss_t_inverse_cdf_beta: 1.0
  cfm_loss_reduction: sqrt
  action_perturb_std: 0.02
  imf_logit_normal_mean: -0.4
  imf_logit_normal_std: 1.0
  # Boundary anchors (r=t) train the auxiliary instantaneous-velocity head.
  imf_fm_proportion: 0.5
  imf_aux_v_loss_coef: 1.0
  # Keep the raw score in the FPO ratio; nonzero values only normalize gradients.
  imf_adaptive_gradient_norm_p: 0.0
  imf_adaptive_gradient_norm_eps: 0.01

algorithm:
  class_name: IMFFPO
  num_learning_epochs: 16
  num_mini_batches: 4
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  # IMFFPO does not define the legacy CFM adaptive-KL proxy.
  schedule: fixed
  gamma: 0.99
  lam: 0.95
  knn_entropy_coef: 0.0
  knn_entropy_k: 1
  desired_kl: 1.0e-4
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: false
  clip_param: 0.05
  trust_region_mode: aspo
  normalize_advantage: true
  normalize_advantage_per_mini_batch: false
  advantage_clamp: [100.0, 100.0]
  n_samples_per_action: 16
  cfm_diff_clamp_max: 10.0
  cfm_loss_clamp: 20.0
  cfm_loss_clamp_negative_advantages: true
  cfm_loss_clamp_negative_advantages_max: 20.0
  storage_action_noise_std: 0.0
  ema_decay: 0.95
  ema_warmup_steps: 500
