### Runner ###
max_iterations: 40000
rollouts: 24
save_interval: 100

### Model Architecture ###
obs_embedding_dims: 64
flow_sample_steps: 10
using_historical_obs: false
critic_obs_len: 1
actor_obs_len: 1

actor_hidden_dims: [512, 256, 128]
actor_activations: ["mish", "mish", "mish", "linear"]
critic_hidden_dims: [512, 256, 128]
critic_activations: ["mish", "mish", "mish", "linear"]

### Agent ###
desired_kl: 0.01
learning_rate: 1.0e-4
discount_factor: 0.99
lam: 0.95
time_limit_bootstrap: true
mini_batches: 256
learning_epochs: 5
gaussian_entropy_loss_scale: 0.01
brownian_reg_loss_scale: 0.01
ratio_clip: 0.2
clip_predicted_values: true
value_clip: 0.2
value_loss_scale: 1.0
grad_norm_clip: 1.0
degenerate2gaussian: false
